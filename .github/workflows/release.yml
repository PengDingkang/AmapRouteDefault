name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Must match appVersionName in gradle.properties (for example 0.2.2)
        required: true
        type: string
      publish_source_release:
        description: Publish a release in the source repository
        default: true
        type: boolean
      publish_xposed_release:
        description: Sync metadata and publish to the Xposed Modules Repo
        default: false
        type: boolean
      prerelease:
        description: Mark published releases as prereleases
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XPOSED_REPOSITORY: ${{ vars.XPOSED_REPOSITORY || 'Xposed-Modules-Repo/org.hdhmc.amaproutedefault' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and extract release notes
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/release_tools.py version --expected "$REQUESTED_VERSION" --github-output "$GITHUB_OUTPUT"
          python3 scripts/release_tools.py notes --output "$RUNNER_TEMP/release-notes.md"
          python3 -m unittest discover -s scripts/tests -v
      - name: Check source publication target
        if: inputs.publish_source_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.source_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' | grep -qx true
          git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" > "$RUNNER_TEMP/source-tags"
          if awk -v ref="refs/tags/$TAG" '$2 == ref { found=1 } END { exit !found }' "$RUNNER_TEMP/source-tags"; then
            echo "Source tag already exists: $TAG"
            exit 1
          fi
      - name: Check Xposed publication target
        if: inputs.publish_xposed_release
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.xposed_tag }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$XPOSED_REPOSITORY" --jq '.permissions.push' | grep -qx true
          git ls-remote --tags "https://github.com/$XPOSED_REPOSITORY.git" > "$RUNNER_TEMP/xposed-tags"
          if awk -v ref="refs/tags/$TAG" '$2 == ref { found=1 } END { exit !found }' "$RUNNER_TEMP/xposed-tags"; then
            echo "Xposed tag already exists: $TAG"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/amap-release.jks"
      - name: Build, test and lint signed release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/amap-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:testDebugUnitTest :app:lintRelease --no-daemon
      - name: Verify release APK
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: python3 scripts/release_tools.py verify-apk app/build/outputs/apk/release/app-release.apk --variant release
      - name: Prepare release assets and Xposed metadata
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          mkdir -p dist dist-xposed
          cp app/build/outputs/apk/release/app-release.apk "dist/AmapRouteDefault-${VERSION_NAME}.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/AmapRouteDefault-${VERSION_NAME}-mapping.txt"
          (cd dist && sha256sum ./*.apk ./*-mapping.txt > SHA256SUMS)
          cp "dist/AmapRouteDefault-${VERSION_NAME}.apk" dist-xposed/
          python3 scripts/release_tools.py xposed-metadata --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/xposed-metadata"
          {
            printf '### 安装要求\n\nAndroid 14+、arm64-v8a、现代 Xposed API 102。作用域：高德地图（com.autonavi.minimap）。\n\n### 更新内容\n\n'
            cat "$RUNNER_TEMP/release-notes.md"
            printf '\nSource: https://github.com/%s/commit/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$RUNNER_TEMP/xposed-release-notes.md"
      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AmapRouteDefault-${{ steps.version.outputs.version_name }}-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Sync Xposed repository metadata
        if: inputs.publish_xposed_release
        id: xposed
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          METADATA_DIR: ${{ runner.temp }}/xposed-metadata
        run: bash scripts/sync_xposed.sh
      - name: Publish source release
        if: inputs.publish_source_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.source_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true || "$VERSION_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AmapRouteDefault $VERSION_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"
      - name: Publish Xposed repository release
        if: inputs.publish_xposed_release
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
          TAG: ${{ steps.version.outputs.xposed_tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          METADATA_COMMIT: ${{ steps.xposed.outputs.commit }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=()
          if [[ "$PRERELEASE" == true || "$VERSION_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" dist-xposed/*.apk --repo "$XPOSED_REPOSITORY" --target "$METADATA_COMMIT" \
            --title "$VERSION_NAME" --notes-file "$RUNNER_TEMP/xposed-release-notes.md" "${args[@]}"
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/amap-release.jks"
